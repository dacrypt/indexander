[workspace]
resolver = "3"
members = ["crates/core", "crates/index", "crates/crawl", "crates/rank", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dacrypt/indexander"
authors = ["David Velásquez"]

[workspace.dependencies]
indexander-core = { path = "crates/core", version = "0.1.0" }
indexander-index = { path = "crates/index", version = "0.1.0" }
indexander-crawl = { path = "crates/crawl", version = "0.1.0" }
indexander-rank = { path = "crates/rank", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1

[package]
name = "indexander-cluster"
description = "Coordinator and shard roles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
indexander-core = { version = "0.1.0", path = "../core" }
indexander-crawl = { version = "0.1.0", path = "../crawl" }
indexander-index = { version = "0.1.0", path = "../index" }
indexander-proto = { version = "0.1.0", path = "../proto" }
indexander-rank = { version = "0.1.0", path = "../rank" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
